name: Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:

  Documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint Markdown
        run: markdownlint "**/*.md"


  golangci-lint:
    runs-on: ubuntu-latest
    needs: Documentation

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'   # Wichtig: 1.23 ist NICHT kompatibel!

      - name: Install dependencies
        run: make build

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.1
          args: --timeout=5m


  Build:
    runs-on: ubuntu-latest
    needs: golangci-lint

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make build


  Tests:
    runs-on: ubuntu-latest
    needs: Build

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: make build

      - name: Unit Tests
        run: make unit-test

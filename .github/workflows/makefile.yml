name: Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:

  Documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint Markdown
        run: markdownlint "**/*.md"


  lint-go:
    runs-on: ubuntu-latest
    needs: Documentation

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install revive
        run: go install github.com/mgechev/revive@latest

      - name: Run revive
        run: $(go env GOPATH)/bin/revive -config revive.toml ./...


  Build:
    runs-on: ubuntu-latest
    needs: Documentation
    steps:
    - uses: actions/checkout@v4

    - name: Fix apt cache
      run: |
        sudo rm -rf /var/lib/apt/lists/*
        sudo apt-get clean
        sudo apt-get update --fix-missing


    - name: install emorgency dependencies
      run: sudo apt install libayatana-appindicator3-dev

    - name: make build
      run: make build

  Tests:
    runs-on: ubuntu-latest
    needs: Build
    steps:
    - uses: actions/checkout@v4

    - name: Fix apt cache
      run: |
        sudo rm -rf /var/lib/apt/lists/*
        sudo apt-get clean
        sudo apt-get update --fix-missing


    - name: install emorgency dependencies
      run: sudo apt install libayatana-appindicator3-dev

    - name: Install dependencies
      run: make build

    - name: Unit-Tests
      run: make unit-test